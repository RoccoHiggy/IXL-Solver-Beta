<!DOCTYPE html>
<html>
<head>
  <title>Math Solver</title>
  <style>
    body {
      background-color: #28a745;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      color: white;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      background-color: #1d7a35;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }
    #result {
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <button id="solveBtn">SOLVE</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
